<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" role="img" aria-label="Résultats mesurés du benchmark rightsize"><title>Résultats mesurés du benchmark rightsize</title><rect width="1280" height="390" rx="16" fill="#FBFAF6"/><text x="48.0" y="66.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="40" fill="#12181F" font-weight="700">Mesuré, pas promis</text><rect x="48" y="100" width="378" height="250" rx="14" fill="#F0EEE6" stroke="#D5D2C6"/><text x="76.0" y="210.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="84" fill="#12181F" font-weight="700">100</text><text x="76.0" y="268.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="27" fill="#55606B">exécutions valides,</text><text x="76.0" y="304.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="27" fill="#55606B">notées par tests ou oracle</text><rect x="451" y="100" width="378" height="250" rx="14" fill="#F0EEE6" stroke="#D5D2C6"/><text x="479.0" y="210.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="84" fill="#B85C00" font-weight="700">×7,7</text><text x="479.0" y="268.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="27" fill="#55606B">coût d'Opus 5.5 en max</text><text x="479.0" y="304.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="27" fill="#55606B">face à high, sans gain</text><rect x="854" y="100" width="378" height="250" rx="14" fill="#F0EEE6" stroke="#D5D2C6"/><text x="882.0" y="210.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="84" fill="#0B7A4B" font-weight="700">−98 %</text><text x="882.0" y="268.0" font-family="'Segoe UI',-apple-system,BlinkMac